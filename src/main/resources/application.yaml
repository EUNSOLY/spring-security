spring:
  application:
    name: securitystudy
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true   # 쿼리 줄바꿈해서 보기 좋게
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/security
    username: ${DB_USER}
    password: ${DB_PASSWORD}

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG              # 실행되는 SQL
    org.hibernate.orm.jdbc.bind: TRACE    # ? 자리에 들어간 실제 값 (Boot 3 / Hibernate 6)

