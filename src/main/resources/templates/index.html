<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>메인 페이지</title>
</head>
<body>
<h1>메인 페이지</h1>
<p>누구나 접근할 수 있는 페이지입니다.</p>

<div sec:authorize="isAuthenticated()">
    <p><span sec:authentication="name">사용자</span>님 환영합니다.</p>
</div>

</body>
</html>
